<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pivot Level — ניהול ספקים למסעדות, ישירות מהוואטסאפ</title>
    <meta
      name="description"
      content="המערכת לניהול מלאי וספקים למסעדות — ספירות, הזמנות, אישורים וחשבוניות, הכל מתוך הוואטסאפ. בעברית מלאה."
    />
    <meta property="og:title" content="Pivot Level — ניהול ספקים למסעדות" />
    <meta
      property="og:description"
      content="ניהול מלאי, הזמנות ואישורים למסעדות — ישירות מהוואטסאפ."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/jpeg" href="./assets/pivot-logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Rubik:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <!-- Accessibility preferences FOUC bootstrap.
         Re-applies persisted a11y prefs (contrast/text-size/etc.) before
         React hydrates so users with high-contrast or large-text settings
         don't see a flash of default styling. Keep in sync with
         src/a11y/prefsStore.js (A11Y_BOOTSTRAP_SCRIPT). -->
    <script>
      (function(){try{var raw=localStorage.getItem("pivot_a11y_prefs_v1");
      if(!raw)return;var p=JSON.parse(raw);if(!p||p.version!==1)return;
      var c=document.documentElement.classList;
      c.toggle("a11y-links",p.links);
      c.toggle("a11y-contrast-high",p.contrast==='high');
      c.toggle("a11y-contrast-invert",p.contrast==='invert');
      c.toggle("a11y-contrast-mono",p.contrast==='mono');
      c.toggle("a11y-text-115",p.textSize===115);
      c.toggle("a11y-text-130",p.textSize===130);
      c.toggle("a11y-text-150",p.textSize===150);
      c.toggle("a11y-lines-16",p.lineSpacing==='wide');
      c.toggle("a11y-lines-20",p.lineSpacing==='wider');
      c.toggle("a11y-readable-font",p.readableFont);
      c.toggle("a11y-highlight-headings",p.highlightHeadings);
      c.toggle("a11y-cursor-black",p.blackCursor);
      c.toggle("a11y-cursor-large",p.largeCursor);
      c.toggle("a11y-reduce-motion",p.reduceMotion);
      }catch(e){}})();
    </script>
  </head>
  <body>
    <a href="#main-content" class="pivot-skip-link">דלג לתוכן הראשי</a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
